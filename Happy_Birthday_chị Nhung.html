<HTML>
<HEAD>
    <TITLE> Happy Birthday </TITLE>
    <META NAME="Generator" CONTENT="EditPlus">
    <META NAME="Author" CONTENT="">
    <META NAME="Keywords" CONTENT="">
    <META NAME="Description" CONTENT="">
    <style>
        canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: #2e2e2e;
        }
        #wishLayer {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }
        .wish {
            position: absolute;
            left: 0;
            top: 0;
            white-space: nowrap;
            font-family: 'Segoe Script', 'Brush Script MT', cursive;
            font-weight: 600;
            color: #f6d9ff;
            text-shadow:
                0 0 6px #c04dff,
                0 0 14px #ff6fd8;
            will-change: transform;
        }
        #centerPhotoWrap {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            animation: photoGrow 4s ease-out 3s forwards;
        }
        #centerPhotoWrap img {
            display: block;
            max-height: 60vh;
            max-width: 46vw;
            filter:
                drop-shadow(0 0 10px #ff8fd6)
                drop-shadow(0 0 24px #c04dff)
                drop-shadow(0 0 42px #ff4fae);
        }
        #photo2 {
            display: none;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }
        @keyframes photoGrow {
            0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            15%  { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</HEAD>

<BODY style=" background-color: #000;">

<canvas id="heart"></canvas>
<div id="wishLayer"></div>
<div id="centerPhotoWrap">
    <!-- Hình 1: Hình lúc nhỏ -->
    <img id="photo1" src="Gemini_Generated_Image_14uj2s14uj2s14uj-removebg-preview.png" alt="Ảnh nhỏ">
    <!-- Hình 2: Hình khi lớn -->
    <img id="photo2" src="Screenshot_2026-08-08_140219-removebg-preview.png" alt="Ảnh lớn">
</div>

<script>
    window.requestAnimationFrame =
            window.__requestAnimationFrame ||
            window.requestAnimationFrame ||
            window.webkitRequestAnimationFrame ||
            window.mozRequestAnimationFrame ||
            window.oRequestAnimationFrame ||
            window.msRequestAnimationFrame ||
            (function () {
                return function (callback, element) {
                    var lastTime = element.__lastTime;
                    if (lastTime === undefined) {
                        lastTime = 0;
                    }
                    var currTime = Date.now();
                    var timeToCall = Math.max(1, 33 - (currTime - lastTime));
                    window.setTimeout(callback, timeToCall);
                    element.__lastTime = currTime + timeToCall;
                };
            })();
    window.isDevice = (/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(((navigator.userAgent || navigator.vendor || window.opera)).toLowerCase()));
    var loaded = false;
    var init = function () {
        if (loaded) return;
        loaded = true;
        var mobile = window.isDevice;
        var koef = mobile ? 0.5 : 1;
        var canvas = document.getElementById('heart');
        var ctx = canvas.getContext('2d');
        var width = canvas.width = koef * innerWidth;
        var height = canvas.height = koef * innerHeight;
        var rand = Math.random;
        ctx.fillStyle = "rgba(0,0,0,1)";
        ctx.fillRect(0, 0, width, height);


        var heartPosition = function (rad) {
            return [Math.pow(Math.sin(rad), 3), -(15 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 * rad) - Math.cos(4 * rad))];
        };
        var scaleAndTranslate = function (pos, sx, sy, dx, dy) {
            return [dx + pos[0] * sx, dy + pos[1] * sy];
        };

        window.addEventListener('resize', function () {
            width = canvas.width = koef * innerWidth;
            height = canvas.height = koef * innerHeight;
            ctx.fillStyle = "rgba(0,0,0,1)";
            ctx.fillRect(0, 0, width, height);
        });

        var traceCount = mobile ? 20 : 50;
        var pointsOrigin = [];
        var i;
        var dr = mobile ? 0.3 : 0.1;
        for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 210, 13, 0, 0));
        for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 150, 9, 0, 0));
        for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 90, 5, 0, 0));
        var heartPointsCount = pointsOrigin.length;

        var targetPoints = [];
        var pulse = function (kx, ky) {
            for (i = 0; i < pointsOrigin.length; i++) {
                targetPoints[i] = [];
                targetPoints[i][0] = kx * pointsOrigin[i][0] + width / 2;
                targetPoints[i][1] = ky * pointsOrigin[i][1] + height / 2;
            }
        };

        var e = [];
        for (i = 0; i < heartPointsCount; i++) {
            var x = rand() * width;
            var y = rand() * height;
            e[i] = {
                vx: 0,
                vy: 0,
                R: 2,
                speed: rand() + 5,
                q: ~~(rand() * heartPointsCount),
                D: 2 * (i % 2) - 1,
                force: 0.2 * rand() + 0.7,
                f: "hsla(0," + ~~(40 * rand() + 60) + "%," + ~~(60 * rand() + 20) + "%,.3)",
                trace: []
            };
            for (var k = 0; k < traceCount; k++) e[i].trace[k] = {x: x, y: y};
        }

        var config = {
            traceK: 0.4,
            timeDelta: 0.01
        };

        var time = 0;
        var loop = function () {
            var n = -Math.cos(time);
            pulse((1 + n) * .5, (1 + n) * .5);
            time += ((Math.sin(time)) < 0 ? 9 : (n > 0.8) ? .2 : 1) * config.timeDelta;
            ctx.fillStyle = "rgba(0,0,0,.1)";
            ctx.fillRect(0, 0, width, height);
            for (i = e.length; i--;) {
                var u = e[i];
                var q = targetPoints[u.q];
                var dx = u.trace[0].x - q[0];
                var dy = u.trace[0].y - q[1];
                var length = Math.sqrt(dx * dx + dy * dy);
                if (10 > length) {
                    if (0.95 < rand()) {
                        u.q = ~~(rand() * heartPointsCount);
                    }
                    else {
                        if (0.99 < rand()) {
                            u.D *= -1;
                        }
                        u.q += u.D;
                        u.q %= heartPointsCount;
                        if (0 > u.q) {
                            u.q += heartPointsCount;
                        }
                    }
                }
                u.vx += -dx / length * u.speed;
                u.vy += -dy / length * u.speed;
                u.trace[0].x += u.vx;
                u.trace[0].y += u.vy;
                u.vx *= u.force;
                u.vy *= u.force;
                for (k = 0; k < u.trace.length - 1;) {
                    var T = u.trace[k];
                    var N = u.trace[++k];
                    N.x -= config.traceK * (N.x - T.x);
                    N.y -= config.traceK * (N.y - T.y);
                }
                ctx.fillStyle = u.f;
                for (k = 0; k < u.trace.length; k++) {
                    ctx.fillRect(u.trace[k].x, u.trace[k].y, 1, 1);
                }
            }
            window.requestAnimationFrame(loop, canvas);
        };

        loop();
    };

    var s = document.readyState;
    if (s === 'complete' || s === 'loaded' || s === 'interactive') init();
    else document.addEventListener('DOMContentLoaded', init, false);

    // ================= LỜI CHÚC CHẠY NGẪU NHIÊN =================
    var wishLines = [
        "Happy Birthday chị",
        "Mãi xinh đẹp nha chị ❤️",
        "Mãi vui vẻ nha chị ❤️",
        "Chúc chị luôn hạnh phúc ❤️",
        "Tuổi mới thật rực rỡ ✨",
        "Mong chị luôn mỉm cười ❤️",
        "Chúc chị luôn gặp may mắn ❤️",
        "Tuổi mới nhiều niềm vui nha chị 🥰",
        "Mãi trẻ đẹp nha ❤️",
        "Luôn vui và hạnh phúc ❤️",
        "Chúc chị sinh nhật thật vui 🎂",
        "Mãi là anh em ❤️",
        "Tuổi mới thật nhiều yêu thương ❤️"
    ];

    var wishLayer = document.getElementById('wishLayer');
    var activeWishes = [];
    var maxWishes = window.isDevice ? 10 : 18;

    function spawnWish() {
        if (activeWishes.length >= maxWishes) return;

        var el = document.createElement('div');
        el.className = 'wish';
        el.textContent = wishLines[~~(Math.random() * wishLines.length)];

        var size = 12 + Math.random() * 10;
        el.style.fontSize = size + 'px';

        var edge = ~~(Math.random() * 4);
        var startX, startY;
        if (edge === 0) { startX = -400; startY = Math.random() * innerHeight; }
        else if (edge === 1) { startX = innerWidth + 20; startY = Math.random() * innerHeight; }
        else if (edge === 2) { startX = Math.random() * innerWidth; startY = -40; }
        else { startX = Math.random() * innerWidth; startY = innerHeight + 40; }

        var angle = Math.random() * Math.PI * 2;
        var speed = 4 + Math.random() * 5;
        var vx = Math.cos(angle) * speed;
        var vy = Math.sin(angle) * speed;
        var curve = (Math.random() - 0.5) * 0.04;
        var tiltDeg = Math.max(-18, Math.min(18, (vy / speed) * 18));

        var pulsePhase = Math.random() * Math.PI * 2;
        var pulseFreq = 0.03 + Math.random() * 0.04;
        var pulseRange = 0.25 + Math.random() * 0.25;

        el.style.opacity = (0.55 + Math.random() * 0.45).toFixed(2);
        el.style.transform = 'translate(' + startX + 'px,' + startY + 'px) rotate(' + tiltDeg + 'deg)';

        wishLayer.appendChild(el);

        activeWishes.push({
            node: el,
            x: startX,
            y: startY,
            vx: vx,
            vy: vy,
            curve: curve,
            pulsePhase: pulsePhase,
            pulseFreq: pulseFreq,
            pulseRange: pulseRange
        });
    }

    var wishFrame = 0;
    function moveWishes() {
        var margin = 420;
        wishFrame++;
        for (var i = activeWishes.length - 1; i >= 0; i--) {
            var w = activeWishes[i];
            var nvx = w.vx * Math.cos(w.curve) - w.vy * Math.sin(w.curve);
            var nvy = w.vx * Math.sin(w.curve) + w.vy * Math.cos(w.curve);
            w.vx = nvx;
            w.vy = nvy;

            w.x += w.vx;
            w.y += w.vy;

            var spd = Math.sqrt(w.vx * w.vx + w.vy * w.vy) || 1;
            var tiltDeg = Math.max(-18, Math.min(18, (w.vy / spd) * 18));
            var scale = 1 + Math.sin(wishFrame * w.pulseFreq + w.pulsePhase) * w.pulseRange;

            w.node.style.transform =
                'translate(' + w.x.toFixed(1) + 'px,' + w.y.toFixed(1) + 'px) ' +
                'rotate(' + tiltDeg.toFixed(1) + 'deg) ' +
                'scale(' + scale.toFixed(2) + ')';

            if (w.x < -margin || w.x > innerWidth + margin || w.y < -margin || w.y > innerHeight + margin) {
                wishLayer.removeChild(w.node);
                activeWishes.splice(i, 1);
            }
        }
        window.requestAnimationFrame(moveWishes);
    }

    function startWishes() {
        window.setInterval(spawnWish, 220);
        moveWishes();
    }

    var ws = document.readyState;
    if (ws === 'complete' || ws === 'loaded' || ws === 'interactive') startWishes();
    else document.addEventListener('DOMContentLoaded', startWishes, false);

    // ================= XỬ LÝ CHUYỂN ẢNH VÀ MỜ DẦN SAU 4S =================
    var centerPhotoWrap = document.getElementById('centerPhotoWrap');
    var photo1 = document.getElementById('photo1');
    var photo2 = document.getElementById('photo2');

    centerPhotoWrap.addEventListener('animationend', function () {
        // Khi hình 1 dừng phóng to
        photo1.style.display = 'none';
        photo2.style.display = 'block';
        
        // Hiện hình 2 mượt mà
        setTimeout(function() {
            photo2.style.opacity = '1';
        }, 50);

        // Giữ hình 2 trong 4 giây rồi làm mờ và biến mất
        setTimeout(function () {
            photo2.style.opacity = '0';
            setTimeout(function () {
                centerPhotoWrap.style.display = 'none';
            }, 600);
        }, 4000);
    });
</script>
</BODY>
</HTML>
